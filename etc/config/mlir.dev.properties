# Use AIR binaries for the repo's default dev environment.
# Override AIR_TOOLS_ROOT in Docker, for example:
#   docker run -e AIR_TOOLS_ROOT=/artifacts/mlir-air/install ...
compilers=&airopt:&airtranslate

defaultCompiler=airopt-csl

group.airopt.compilers=airopt-csl
group.airopt.baseName=air-opt (CSL)

group.airtranslate.compilers=airtranslate-csl
group.airtranslate.baseName=air-translate (CSL)

compiler.airopt-csl.exe=${env:AIR_TOOLS_ROOT:-/home/bricklib_dataflow/air-csl/mlir-air/install}/bin/air-opt
compiler.airopt-csl.name=air-opt (CSL)
compiler.airopt-csl.semver=1.0.0

compiler.airtranslate-csl.exe=${env:AIR_TOOLS_ROOT:-/home/bricklib_dataflow/air-csl/mlir-air/install}/bin/air-translate
compiler.airtranslate-csl.name=air-translate (CSL)
compiler.airtranslate-csl.semver=1.0.0
